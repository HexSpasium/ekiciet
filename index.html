<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="description" content="EKİCİ ET MANGAL dijital menü. Adaklık ve kurbanlık satışı ve kesimi.">
<title>EKİCİ ET MANGAL | Dijital Menü</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#171211;--line:#4b2520;--red:#d52b22;--muted:#b8aaa5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#4b100b 0,transparent 43%),var(--bg);color:#f8f2ef;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 22px}.top{height:76px;border-bottom:1px solid #57201b;background:#090909eF;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-weight:bold;letter-spacing:.5px}.logo{display:block;width:184px;height:63px;object-fit:contain;flex:0 0 auto}.top a{color:#eee;text-decoration:none}.top nav{display:flex;gap:26px}.top nav a{font-size:14px;color:#d6cbc7}.hero{min-height:420px;display:flex;align-items:center;position:relative;overflow:hidden;padding:58px 0;border-bottom:1px solid #54201b}.hero:after{content:'🥩';position:absolute;right:8%;font-size:clamp(130px,22vw,260px);opacity:.17;filter:drop-shadow(0 20px 30px #a21d12)}.eyebrow{color:#ff766a;font-size:11px;letter-spacing:3px;font-weight:bold}.hero h1{font:700 clamp(48px,7vw,82px)/.98 Georgia,serif;margin:22px 0}.hero h1 em{color:#e6382d}.hero p{font:italic 23px/1.4 Georgia,serif;color:#e6d8d3}.actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:25px 0}.btn{display:inline-block;background:linear-gradient(130deg,#ed3a30,#850b08);border:1px solid #fa665b;border-radius:7px;padding:13px 18px;color:white;text-decoration:none;font-weight:bold}.phone{color:white;text-decoration:none}.address{color:#c1b4af;font-size:12px}.section{padding:58px 0}.center{text-align:center}.kicker{color:#fa685c;letter-spacing:3px;font-size:11px;font-weight:bold}.section h2{font:700 40px Georgia;margin:10px 0}.section h2 em{color:#ed3b30}.sub{color:var(--muted);font-size:14px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:28px 0 22px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #49302c;background:#171211;color:#eee;padding:10px 15px;border-radius:25px;cursor:pointer}.tabs button.active{background:#a71914;border-color:#f05247}.search{background:#151110;border:1px solid #49302c;border-radius:25px;padding:10px 15px;color:white;min-width:220px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:linear-gradient(145deg,#201715,#100e0e);border:1px solid #49231e;border-radius:12px;overflow:hidden}.food{height:150px;display:grid;place-items:center;background:radial-gradient(ellipse,#572019,#1a1110);font-size:62px}.body{padding:15px}.body small{color:#f26a5f;font-size:10px;text-transform:uppercase;letter-spacing:1px}.body h3{margin:8px 0;font:700 19px Georgia}.body p{color:#bdaea9;font-size:12px;line-height:1.5;min-height:38px}.price{color:#fff;font-weight:bold;margin-top:14px;font-size:14px}.empty{grid-column:1/-1;text-align:center;color:#bdaea9;padding:35px}.features{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #49231e;border-radius:12px;background:#140e0d;margin:0 0 55px;padding:25px 10px;text-align:center}.features b{display:block;margin:8px}.features span{color:#bdaea9;font-size:12px}footer{border-top:1px solid #49231e;background:#0c0909;padding:35px 0;color:#c8bab5}footer .cols{display:grid;grid-template-columns:2fr 2fr 1fr;gap:25px}footer h3{color:#f36b5f;font-size:12px;letter-spacing:2px}footer p,footer a{font-size:13px;line-height:1.8;color:#d8ceca;text-decoration:none}.copy{text-align:center;border-top:1px solid #2c1b18;margin-top:25px;padding-top:18px;color:#8f817d;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.hero:after{right:-5%;opacity:.12}.top nav{gap:13px}}@media(max-width:560px){.top{height:65px;padding:0 14px}.top nav{display:none}.brand{font-size:13px}.logo{width:150px;height:51px}.hero{min-height:390px;padding:45px 0}.hero h1{font-size:52px}.hero p{font-size:19px}.section{padding:42px 0}.section h2{font-size:34px}.toolbar{align-items:stretch;flex-direction:column}.tabs{flex-wrap:nowrap;overflow:auto;padding-bottom:5px}.tabs button{white-space:nowrap;font-size:11px}.search{width:100%}.grid{gap:9px}.food{height:115px;font-size:48px}.body{padding:11px}.body h3{font-size:15px}.body p{font-size:11px;min-height:50px}.features{grid-template-columns:1fr;gap:18px}.features>div{border-bottom:1px solid #39221e;padding-bottom:12px}.features>div:last-child{border:0;padding:0}footer .cols{grid-template-columns:1fr 1fr}footer .cols>div:first-child{grid-column:1/-1}}
/* Header/footer banners: all repeated identity and contact copy is carried by the artwork */
.top{height:auto;min-height:0;padding:0;border:0;background:#050505;position:relative;display:block}
.top .brand,.top nav,.top>.btn{display:none!important}
.hero{display:none!important}
.site-banner{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:contain;background:#050505}
.banner-link{display:block;line-height:0;background:#050505}
main.wrap{max-width:1440px;padding:0 clamp(14px,3vw,42px)}
.section{padding:clamp(26px,4vw,52px) 0}
@media(max-width:600px){.site-banner{aspect-ratio:3/1;object-fit:contain}.section{padding:25px 0}}
</style>
</head>
<body>
<header class="top"><a class="banner-link" href="#menu"><img class="site-banner" src="https://raw.githubusercontent.com/HexSpasium/ekiciet/main/public/ust-banner.png" alt="EKİCİ ET MANGAL üst banner ve menü tanıtımı"></a></header>
<main class="wrap">
<section class="section" id="menu"><div class="center"><div class="kicker">LEZZETLERİMİZİ KEŞFEDİN</div><h2>DİJİTAL <em>MENÜ</em></h2><p class="sub">Ürünlerimizi kategorilere göre inceleyebilirsiniz.</p></div>
<div class="toolbar"><div class="tabs" id="tabs"><button class="active" data-cat="all">Tümü</button><button data-cat="cooked">Pişmiş Ürünler</button><button data-cat="raw">Çiğ Ürünler</button><button data-cat="drinks">İçecekler</button><button data-cat="extras">Ekstralar</button></div><input class="search" id="search" placeholder="Menüde ara..."></div><div class="grid" id="products"></div></section>
</main>
<footer id="contact" style="padding:0;border:0;background:#050505"><img class="site-banner" src="https://raw.githubusercontent.com/HexSpasium/ekiciet/main/public/alt-banner.png" alt="EKİCİ ET MANGAL iletişim bannerı"></footer>
<script>
const products=[
{n:'Adana Kebap',c:'cooked',d:'Zırhta çekilmiş et ve özel baharatlarla hazırlanır.',e:'🥩'},
{n:'Urfa Kebap',c:'cooked',d:'Acısız, köz ateşinde usulüne uygun pişirilir.',e:'🍢'},
{n:'Kuzu Şiş',c:'cooked',d:'Lokum kıvamında kuzu eti, mangalda pişirilir.',e:'🔥'},
{n:'Dana Kuşbaşı',c:'raw',d:'Özenle doğranmış, pişirmeye hazır dana eti.',e:'🥩'},
{n:'Kuzu Kuşbaşı',c:'raw',d:'Mangal ve tava için hazırlanmış kuzu eti.',e:'🍖'},
{n:'Ayran',c:'drinks',d:'Soğuk servis edilir.',e:'🥛'},
{n:'Şalgam',c:'drinks',d:'Acılı veya acısız seçenekleriyle.',e:'🥤'},
{n:'Mevsim Salata',c:'extras',d:'Mevsim yeşillikleriyle günlük hazırlanır.',e:'🥗'}
];
const labels={cooked:'Pişmiş Ürünler',raw:'Çiğ Ürünler',drinks:'İçecekler',extras:'Ekstralar'};let active='all';
function draw(){const q=document.getElementById('search').value.toLocaleLowerCase('tr');const list=products.filter(p=>(active==='all'||p.c===active)&&(p.n+' '+p.d).toLocaleLowerCase('tr').includes(q));document.getElementById('products').innerHTML=list.length?list.map(p=>'<article class="card"><div class="food">'+p.e+'</div><div class="body"><small>'+labels[p.c]+'</small><h3>'+p.n+'</h3><p>'+p.d+'</p><div class="price">Fiyat bilgisi için iletişime geçin</div></div></article>').join(''):'<div class="empty">Bu kategoride eşleşen ürün bulunamadı.</div>'}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(!b)return;active=b.dataset.cat;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));draw()});document.getElementById('search').addEventListener('input',draw);document.getElementById('year').textContent=new Date().getFullYear();draw();
</script>
</body></html>
